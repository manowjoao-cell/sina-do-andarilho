<style>
/* VOICE: sobrevivência noturna, tensa e recompensadora
   IDEA: uma clareira cercada pela noite, a luz do herói é o único lugar seguro
   PICTURE: o próprio jogo em tela cheia, visto de cima
   COLOUR and TYPE: azul-noite profundo, luz âmbar da tocha, as 6 cores de raridade; Pixelify Sans + Rubik */
:root{color-scheme:dark;--bg:#0a0f1c;--panel:#121a2b;--line:#26324a;--ink:#eef0f6;--dim:#9aa6bf;--amb:#ffb54a;--rose:#ff7a5c;
--r0:#9aa3ad;--r1:#3fc464;--r2:#3d8bff;--r3:#a95cff;--r4:#ffc61a;--r5:#ff3b3b}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:Rubik,system-ui,sans-serif;overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
canvas#cv{position:fixed;inset:0;width:100vw;height:100dvh;display:block;touch-action:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.px{font-family:"Pixelify Sans",Rubik,sans-serif}
.hidden{display:none!important}
/* HUD */
#hud{position:fixed;inset:0;pointer-events:none;padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
.xpbar{position:absolute;left:0;right:0;top:0;height:10px;background:#0b1222cc;border-bottom:1px solid #26324a}
.xpbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#3d8bff,#7fd3ff);box-shadow:0 0 10px #3d8bff}
.hrow{position:absolute;top:16px;left:12px;right:12px;display:flex;align-items:flex-start;gap:10px}
.lvl{font:700 15px "Pixelify Sans";background:#121a2bcc;border:1px solid #26324a;border-radius:10px;padding:6px 10px;min-width:64px;text-align:center}
.timer{position:absolute;left:50%;top:16px;transform:translateX(-50%);text-align:center}
.timer b{display:block;font:700 30px/1 "Pixelify Sans";text-shadow:0 2px 0 #000,0 0 14px #000}
.timer small{display:block;font-size:12px;color:var(--dim);margin-top:3px;text-shadow:0 1px 2px #000}
.kills{margin-left:auto;font:700 14px Rubik;background:#121a2bcc;border:1px solid #26324a;border-radius:10px;padding:6px 10px}
.pbtn{pointer-events:auto;width:40px;height:40px;border-radius:10px;background:#121a2bcc;border:1px solid #26324a;display:grid;place-items:center}
.wps{position:absolute;left:12px;bottom:calc(12px + env(safe-area-inset-bottom));display:flex;flex-wrap:wrap;gap:6px;max-width:60vw}
.wp{position:relative;width:42px;height:42px;border-radius:10px;background:#121a2bdd;border:1.5px solid #34425f;display:grid;place-items:center}
.wp svg{width:24px;height:24px}
.wp em{position:absolute;right:2px;bottom:0;font:700 11px "Pixelify Sans";font-style:normal;text-shadow:0 1px 2px #000}
.dashb{position:absolute;right:calc(18px + env(safe-area-inset-right));bottom:calc(22px + env(safe-area-inset-bottom));width:76px;height:76px;border-radius:50%;pointer-events:auto;background:radial-gradient(circle,#ffb54a33,#121a2bdd 70%);border:2px solid #ffb54a88;font:700 13px Rubik;color:#ffd79a;display:none;place-items:center;overflow:hidden}
.dashb::before{content:"";position:absolute;inset:0;background:#000a;transform-origin:bottom;transform:scaleY(var(--cd,0))}
.dashb span{position:relative}
body.touch .dashb{display:grid}
.banner{position:absolute;left:50%;top:22%;transform:translateX(-50%);text-align:center;pointer-events:none;opacity:0;transition:opacity .3s}
.banner.on{opacity:1}
.banner b{display:block;font:700 clamp(26px,5vw,44px) "Pixelify Sans";color:#ffd34d;text-shadow:0 3px 0 #000,0 0 24px #ff7a2a}
.banner small{display:block;font-size:15px;color:#e8e0d0;text-shadow:0 2px 3px #000;margin-top:4px}
/* telas */
.ov{position:fixed;inset:0;z-index:20;display:flex;align-items:safe center;justify-content:center;overflow:auto;padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom));background:radial-gradient(ellipse at 50% 30%,#1a2540ee,#05080fee 75%)}
.box{width:min(920px,100%);text-align:center}
h1.title{font:700 clamp(38px,8vw,74px)/1 "Pixelify Sans";margin:6px 0 4px;color:#ffd79a;text-shadow:0 4px 0 #6b2b10,0 0 40px #ff7a2a66}
.sub{color:var(--dim);margin:0 0 18px;font-size:15px}
.menu{display:grid;gap:10px;width:min(360px,100%);margin:0 auto}
.btn{min-height:50px;border-radius:14px;background:#1a2438;border:1px solid #34425f;font-weight:800;font-size:16px;padding:0 18px}
.btn:hover{border-color:#5b6f99}
.btn.pri{background:linear-gradient(180deg,#ffb54a,#e8813a);color:#2a1405;border-color:#ffb54a;box-shadow:0 8px 24px #e8813a44}
.btn.ghost{background:transparent}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.who{font-size:14px;color:var(--dim);margin-top:14px}.who b{color:var(--ink)}
.cls{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:14px 0 18px}
.cc{position:relative;text-align:left;padding:16px;border-radius:16px;background:#141d30;border:2px solid #2b3856;display:grid;gap:6px}
.cc.sel{border-color:var(--c);box-shadow:0 0 24px color-mix(in srgb,var(--c) 35%,transparent)}
.cc:disabled{opacity:.45;cursor:default}
.cc b{font:700 20px "Pixelify Sans";color:var(--c)}
.cc small{color:var(--dim);font-size:13.5px;line-height:1.4}
.cc .av{width:54px;height:54px}
/* cartas */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:16px 0}
.card{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:26px 14px 16px;border-radius:16px;border:2px solid var(--c);background:linear-gradient(180deg,color-mix(in srgb,var(--c) 18%,#121a2b),#0e1524);box-shadow:0 0 22px color-mix(in srgb,var(--c) 25%,transparent);animation:cin .3s ease-out backwards;transition:transform .12s}
.card:hover{transform:translateY(-4px)}
.card:nth-child(2){animation-delay:.06s}.card:nth-child(3){animation-delay:.12s}.card:nth-child(4){animation-delay:.18s}
@keyframes cin{from{opacity:0;transform:translateY(16px) scale(.96)}}
.card .rib{position:absolute;top:-1px;left:50%;transform:translateX(-50%);background:var(--c);color:#0a0f1c;font:700 12px Rubik;padding:3px 12px;border-radius:0 0 9px 9px}
.card .ic{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:#0a0f1c;border:2px solid var(--c);color:var(--c)}
.card .ic svg{width:30px;height:30px}
.card b{font:700 18px "Pixelify Sans";color:#fff}
.card .tag{font-size:12px;color:var(--c);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.card .txt{font-size:14px;color:#d8dde8;line-height:1.4}
.card .bon{font-size:13px;color:#5fe08a;font-weight:700}
.card kbd{position:absolute;top:8px;right:10px;font:600 11px Rubik;color:#8090ad;border:1px solid #34425f;border-radius:5px;padding:1px 5px}
.cx{display:flex;flex-direction:column;align-items:center;gap:5px}
body.touch kbd,body.touch .kh{display:none}
@media (max-width:600px){.cards{gap:10px;margin:12px 0}.card{flex-direction:row;align-items:center;text-align:left;padding:22px 12px 12px;gap:12px}.card .ic{flex:none;width:50px;height:50px}.card .ic svg{width:26px;height:26px}.cx{align-items:flex-start;gap:2px}.card .rib{left:14px;transform:none}}
.ph{font:700 clamp(26px,4vw,36px) "Pixelify Sans";margin:0;color:#ffd79a}
/* fim */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:16px 0}
.st{background:#141d30;border:1px solid #2b3856;border-radius:12px;padding:12px}
.st b{display:block;font:700 24px "Pixelify Sans"}.st small{color:var(--dim);font-size:12.5px}
.dl{text-align:left;background:#141d30;border:1px solid #2b3856;border-radius:12px;padding:12px 14px;margin:0 auto 16px;max-width:520px}
.dl div{display:grid;grid-template-columns:120px 1fr auto;gap:10px;align-items:center;font-size:13.5px;margin:5px 0}
.dl i{display:block;height:8px;border-radius:4px;background:var(--amb)}
/* altar */
.alt{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px;margin:12px 0 16px;text-align:left}
.au{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:10px 12px;border-radius:12px;background:#141d30;border:1px solid #2b3856}
.au b{font-size:14.5px}.au small{display:block;color:var(--dim);font-size:12.5px}.au em{font-style:normal;color:#8090ad;font-size:12px;margin-left:6px}
.au button{min-width:76px;min-height:38px;border-radius:10px;background:#ffb54a;color:#2a1405;font-weight:800;font-size:13.5px}
.au button:disabled{background:#26324a;color:#8090ad;cursor:default}
.souls{font:700 30px "Pixelify Sans";color:#b88bff}
.bq{display:inline-flex;gap:4px;padding:4px;border-radius:12px;background:#141d30;border:1px solid #2b3856}
.bq button{min-width:54px;min-height:32px;border-radius:9px;font-weight:700;font-size:13px}.bq button.on{background:#ffb54a;color:#2a1405}
/* ranking */
.rk{max-width:520px;margin:12px auto;text-align:left;display:grid;gap:4px}
.rk div{display:grid;grid-template-columns:34px 1fr auto auto;gap:10px;align-items:center;padding:8px 12px;border-radius:10px;background:#141d30;font-size:14px}
.rk div.me{outline:2px solid #ffb54a}
.rk span:nth-child(1){font:700 15px "Pixelify Sans";color:#ffd79a}
.rk span:nth-child(4){color:var(--dim);font-size:12.5px}
.msg{color:var(--dim);font-size:13.5px;min-height:20px}
input.nick{width:100%;min-height:48px;border-radius:12px;border:2px solid #34425f;background:#0e1524;color:var(--ink);font:600 17px Rubik;padding:0 14px;text-align:center}
input.nick:focus{outline:none;border-color:#ffb54a}
.help{max-width:560px;margin:0 auto 16px;text-align:left;color:#cdd3e0;font-size:14.5px;line-height:1.55}
.help li{margin:4px 0}
</style>
